 <div class="story-text">
 <span class="sentence" onclick="speak(this.innerText.replace('🔊', ''))" title="Click a sentence to listen" style="cursor:pointer">🔊 “I can help you,” said the mouse.</span>
 <span class="sentence" onclick="speak(this.innerText.replace('🔊', ''))" title="Click a sentence to listen" style="cursor:pointer">🔊 The mouse bit the ropes with his small teeth.</span>
 <span class="sentence" onclick="speak(this.innerText.replace('🔊', ''))" title="Click a sentence to listen" style="cursor:pointer">🔊 He worked hard, and the net began to break.</span>
 <span class="sentence" onclick="speak(this.innerText.replace('🔊', ''))" title="Click a sentence to listen" style="cursor:pointer">🔊 Soon, the lion was free. “Thank you, little friend!” he said.</span>
 <span class="sentence" onclick="speak(this.innerText.replace('🔊', ''))" title="Click a sentence to listen" style="cursor:pointer">🔊 The lion learned that even a small friend can help.</span>
 </div>
 <button class="audio" onclick="speak('I can help you, said the mouse. The mouse bit the ropes with his small teeth. He worked hard, and the net began to break. Soon, the lion was free. Thank you, little friend, he said. The lion learned that even a small friend can help.')">🔊 Listen to this page</button>
 <div class="actions"><button class="btn secondary" onclick="go(1)">← Previous</button><button class="btn" onclick="go(3)">Learn words →</button></div>`;
 if(key==="vocab") screen.innerHTML=`
 <div class="step-label">STEP 3 · VOCABULARY · 2 MIN</div><h2>Words from the Story</h2>
 <p class="lead">Read each word and its meaning. Press the speaker to hear it.</p>
 <div class="vocab-grid">
 ${word("net","그물","Something used to catch animals or fish.","The lion was caught in a net.")}
 ${word("hunter","사냥꾼","A person who hunts animals.","A hunter's net fell over him.")}
 ${word("caught","잡힌","Unable to get away.","The lion was caught.")}
 ${word("rope","밧줄","A thick, strong string.","The mouse bit the ropes.")}
 ${word("bite","물다","To cut or hold something with your teeth.","The mouse bit the ropes.")}
 ${word("free","자유로운, 풀려난","Not caught or held.","Soon, the lion was free.")}</div>
 <div class="actions"><button class="btn secondary" onclick="go(2)">← Story</button><button class="btn" onclick="go(4)">Check understanding →</button></div>`;
 if(key==="quiz") renderQuiz();
 if(key==="write") screen.innerHTML=`
 <div class="step-label">STEP 5 · MY WRITING · 2 MIN</div><h2>What did you learn?</h2>
 <p class="lead">Write one or two sentences about the story. Use the sentence starter if you need help.</p>
 <div class="story-text" style="font-size:18px">I learned that __________________________.</div>
 <p class="hint">You can write about kindness, friendship, or helping others.</p>
 <textarea id="myWriting" placeholder="I learned that ...">${localStorage.getItem("lionMouseWriting")||""}</textarea>
 <div class="actions"><button class="btn secondary" onclick="go(4)">← Quiz</button><button class="btn" onclick="submitWriting()">Finish writing →</button></div>
 <div id="writingResult" class="writing-result"></div>`;
 if(key==="finish") renderFinish();
}
function word(w,m,d,e){return `<article class="word-card"><div class="word">${w} <button class="audio" onclick="speak('${w}')">🔊</button></div><div class="meaning">${m}</div><div class="definition">${d}</div><div class="hint">${e}</div><button class="audio" onclick="speak('${w}. ${d}. Example: ${e}')">Listen to example</button></article>`}
function selectPrediction(el){document.querySelectorAll("#prediction .choice").forEach(b=>b.classList.remove("selected"));el.classList.add("selected")}
const questions=[
 {q:"What happened to the lion?",opts:["He fell into a river.","He was caught in a net.","He lost his way."],a:1,why:"A hunter's net fell over the lion, and he could not get out."},
 {q:"Who came to help the lion?",opts:["A little mouse","A hunter","Another lion"],a:0,why:"A little mouse heard the lion and came to help."},
 {q:"How did the mouse help?",opts:["He called the hunter.","He pulled the lion away.","He bit the ropes."],a:2,why:"The mouse bit the ropes with his small teeth."},
 {q:"What is one lesson of the story?",opts:["Small friends can help.","Only big animals are strong.","Never walk in a forest."],a:0,why:"The lion learned that even a small friend can help."}
];
function renderQuiz(){
 screen.innerHTML=`<div class="step-label">STEP 4 · READING CHECK · 3 MIN</div><h2>Check Your Understanding</h2><p class="lead">Choose the best answer for each question.</p><div id="questions"></div><div class="actions"><button class="btn secondary" onclick="go(3)">← Vocabulary</button><button class="btn" id="checkQuiz" onclick="checkQuiz()">Check answers</button></div><div id="quizResult" class="feedback"></div>`;
 const holder=document.getElementById("questions");
 questions.forEach((q,i)=>{holder.innerHTML+=`<section style="padding:15px 0;border-bottom:1px solid var(--line)"><strong>${i+1}. ${q.q}</strong><div class="choice-list">${q.opts.map((o,j)=>`<button class="choice" id="q${i}o${j}" onclick="pick(${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}</div><div class="feedback" id="why${i}"></div></section>`});
}
function pick(i,j){if(quizSubmitted)return;answers[i]=j;questions[i].opts.forEach((_,k)=>document.getElementById(`q${i}o${k}`).classList.toggle("selected",j===k))}
function checkQuiz(){
 if(Object.keys(answers).length<questions.length){document.getElementById("quizResult").textContent="Please answer all four questions first.";document.getElementById("quizResult").classList.add("show");return}
 quizSubmitted=true;let score=0;
 questions.forEach((q,i)=>{let correct=answers[i]===q.a;if(correct)score++;document.getElementById(`q${i}o${answers[i]}`).classList.add(correct?"selected":"");const box=document.getElementById(`why${i}`);box.textContent=(correct?"Correct! ":"Not quite. ")+q.why;box.classList.add("show")});
 localStorage.setItem("lionMouseScore",score);
 document.getElementById("quizResult").textContent=`Your score: ${score} / ${questions.length}. Read the explanations, then continue to writing.`;document.getElementById("quizResult").classList.add("show");
 document.getElementById("checkQuiz").textContent="Continue to writing";document.getElementById("checkQuiz").onclick=()=>go(5);
}
function submitWriting(){
 const val=document.getElementById("myWriting").value.trim();if(!val){alert("Please write at least one sentence.");return}
 localStorage.setItem("lionMouseWriting",val);
 const box=document.getElementById("writingResult");box.innerHTML="<strong>Good work!</strong><br>Your idea: "+escapeHtml(val)+"<br><br><span class='hint'>Writing tip: Check that your sentence begins with a capital letter and ends with a period.</span>";box.classList.add("show");
 const btn=document.querySelector("#screen .actions .btn:not(.secondary)");btn.textContent="See my result →";btn.onclick=()=>go(6);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderFinish(){
 const score=localStorage.getItem("lionMouseScore");
 const writing=localStorage.getItem("lionMouseWriting")||"";
 screen.innerHTML=`<div class="step-label">LESSON COMPLETE</div><h2>Well done, reader!</h2><p class="lead">You finished The Lion and the Mouse.</p><div class="story-text" style="text-align:center"><div style="font-size:42px">🦁 🐭</div><strong>Your quiz score: ${score===null?"Not recorded":score+" / 4"}</strong><p style="font-size:16px">“Even a small friend can help.”</p></div><h3>My writing</h3><p>${escapeHtml(writing)}</p><p class="hint">Remember: kindness and help can come from anyone.</p><div class="actions"><button class="btn secondary" onclick="go(0)">Read again</button><button class="btn" onclick="window.print()">Print my work</button></div>`;
}
render();
</script>
</body>
</html>
